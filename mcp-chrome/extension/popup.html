<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #1a1a2e; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d33; flex: none; }
  .ok .dot { background: #1fa65a; }
  #msg { font-weight: 600; }
  p { margin: 0 0 10px; color: #555; line-height: 1.4; }
  code { display: block; background: #f1f1f6; padding: 6px 8px; border-radius: 6px; margin-bottom: 10px; word-break: break-all; }
  button { width: 100%; padding: 8px; margin-top: 6px; border: 0; border-radius: 8px; background: #7c5cff; color: #fff; font-weight: 600; cursor: pointer; }
  button.alt { background: #e6e3ff; color: #3b2bb5; }
  .off-only { display: none; }
  .bad .off-only { display: block; }
</style>
<body class="bad">
  <h1>MCP Chrome Bridge</h1>
  <div class="row"><span class="dot"></span><span id="msg">Checking…</span></div>
  <div class="off-only">
    <p>No MCP server is running. Start one from your agent, or run:</p>
    <code>node mcp-chrome/ext-server.mjs</code>
    <button id="copy" class="alt">Copy command</button>
  </div>
  <button id="retry">Reconnect</button>
  <script src="popup.js"></script>
</body>
